[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    sec_live: real SEC downloads; requires SEC_RUN_LIVE_TESTS=1 and a migrated coordination DB
    us_integration: requires US financial versioning DDL (us_financial_fact_version etc.)
